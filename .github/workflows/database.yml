# Creates or updates the tables in the Supabase database, and creates the
# owner account the first time. Run it from the Actions tab ("Run workflow")
# before the first launch and whenever an update says the database changed.
# Needs repository secrets: DATABASE_URL, DIRECT_URL, SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD.
name: Set up or update the database

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      SEED_DEMO_DATA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the secrets are set
        run: |
          for v in DATABASE_URL DIRECT_URL SEED_ADMIN_EMAIL SEED_ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Missing repository secret: $v"; exit 1; fi
          done
      - run: npm ci
      - name: Create or update tables
        run: npx prisma migrate deploy
      - name: Create the owner account (skipped if it already exists)
        run: npx prisma db seed
