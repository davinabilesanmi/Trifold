# Tests the app and builds the zip to upload to cPanel.
# Download it from the run's "Artifacts" section.
name: Build cPanel package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trifold
          POSTGRES_PASSWORD: trifold
          POSTGRES_DB: trifold_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://trifold:trifold@localhost:5432/trifold_test
      DIRECT_URL: postgresql://trifold:trifold@localhost:5432/trifold_test
      TEST_DATABASE_URL: postgresql://trifold:trifold@localhost:5432/trifold_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run package:cpanel
      - uses: actions/upload-artifact@v4
        with:
          name: trifold-cpanel
          path: dist/trifold-cpanel.zip
          retention-days: 30
